apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-app
spec:
  selector:
    matchLabels:
      app: simple-web-app
  template:
    metadata:
      labels:
        app: simple-web-app
    spec:
      containers:
      - name: simple-web-app
        image: <Image>
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: simple-web-app-svc
spec:
  selector:
    app: simple-web-app
  ports:
  - port: 80
    targetPort: 8080

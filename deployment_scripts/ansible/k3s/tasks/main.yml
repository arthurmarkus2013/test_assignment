---
- name: Create k3s config folder
  ansible.builtin.file:
    path: /etc/rancher/k3s/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create k3s data folder
  ansible.builtin.file:
    path: /var/lib/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download K3s
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/v1.33.1%2Bk3s1/k3s
    dest: /tmp/k3s
    mode: "0755"

- name: Move k3s executable
  ansible.builtin.copy:
    remote_src: true
    src: /tmp/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"

- name: Copy k3s config file
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Copy k3s systemd file
  ansible.builtin.copy:
    src: k3s.service
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0755"

- name: Enable k3s service
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: k3s
    state: started
    enabled: true

- name: Fetch kube_config
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/kube_config
    mode: "0644"
